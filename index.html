<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Narration & Audio Editor</title>
    
    <!-- Load required libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Custom CSS for Toast animations -->
    <style>
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-in forwards; }
        
        textarea {
            font-family: 'Inter', sans-serif;
            line-height: 1.6;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="fixed top-4 right-4 z-50 flex flex-col gap-2"></div>

    <main class="w-full max-w-2xl">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-2xl flex flex-col gap-5">
            
            <!-- Header Section -->
            <div class="flex justify-between items-center mb-1">
                <h2 class="text-xl font-bold text-gray-100 flex items-center gap-2">
                    <i class="fa-solid fa-microphone-lines text-blue-400"></i> Narration Studio
                </h2>
                <button id="btn-ai-generate" class="bg-purple-600 hover:bg-purple-500 text-white px-4 py-2 rounded-lg text-sm transition-colors flex items-center gap-2 shadow-sm focus:ring-2 focus:ring-purple-400 focus:outline-none">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> <span id="ai-gen-btn-text">Generate Story</span>
                </button>
            </div>
            
            <!-- Main Text Input -->
            <textarea id="narration-text" class="w-full bg-gray-950 border border-gray-700 rounded-lg p-5 text-gray-200 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 resize-y min-h-[250px] shadow-inner text-lg placeholder-gray-500" placeholder="Write your story here, or use the 'Generate Story' button above to have AI write one for you..."></textarea>
            
            <div class="flex flex-col gap-4 mt-2">
                
                <!-- Voice Options -->
                <div class="flex flex-col gap-1">
                    <label for="voice-select" class="text-sm text-gray-400 font-medium ml-1">Select Narrator Voice</label>
                    <div class="relative">
                        <select id="voice-select" class="w-full bg-gray-950 border border-gray-700 text-gray-200 rounded-lg p-3 appearance-none focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                            <optgroup label="Bright & Upbeat">
                                <option value="Zephyr">Zephyr (Bright)</option>
                                <option value="Puck">Puck (Upbeat)</option>
                                <option value="Pulcherrima">Pulcherrima (Forward)</option>
                                <option value="Sadachbia">Sadachbia (Lively)</option>
                                <option value="Laomedeia">Laomedeia (Upbeat)</option>
                                <option value="Autonoe">Autonoe (Bright)</option>
                            </optgroup>
                            <optgroup label="Firm & Informative">
                                <option value="Charon">Charon (Informative)</option>
                                <option value="Kore">Kore (Firm)</option>
                                <option value="Orus">Orus (Firm)</option>
                                <option value="Rasalgethi">Rasalgethi (Informative)</option>
                                <option value="Alnilam">Alnilam (Firm)</option>
                                <option value="Enceladus">Enceladus (Breathy)</option>
                            </optgroup>
                            <optgroup label="Smooth & Soft">
                                <option value="Despina">Despina (Smooth)</option>
                                <option value="Callirrhoe">Callirrhoe (Easy-going)</option>
                                <option value="Achernar">Achernar (Soft)</option>
                                <option value="Algieba">Algieba (Smooth)</option>
                                <option value="Erinome">Erinome (Clear)</option>
                                <option value="Sulafat">Sulafat (Warm)</option>
                            </optgroup>
                            <optgroup label="Narrative & Clear">
                                <option value="Iapetus">Iapetus (Clear)</option>
                                <option value="Leda">Leda (Youthful)</option>
                                <option value="Aoede">Aoede (Breezy)</option>
                                <option value="Umbriel">Umbriel (Easy-going)</option>
                                <option value="Algenib">Algenib (Gravelly)</option>
                                <option value="Schedar">Schedar (Even)</option>
                                <option value="Gacrux">Gacrux (Mature)</option>
                                <option value="Fenrir">Fenrir (Excitable)</option>
                            </optgroup>
                        </select>
                        <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="flex gap-3">
                    <button id="btn-play-tts" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-lg font-bold transition-all shadow-md flex justify-center items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed active:scale-[0.98]">
                        <i class="fa-solid fa-play"></i> <span id="play-btn-text">Generate & Play Audio</span>
                    </button>
                    
                    <button id="btn-stop-tts" class="flex-1 bg-red-600 hover:bg-red-500 text-white py-4 rounded-lg font-bold transition-all shadow-md justify-center items-center gap-2 hidden active:scale-[0.98]">
                        <i class="fa-solid fa-stop"></i> Stop Audio
                    </button>
                    
                    <button id="btn-download-audio" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-4 rounded-lg font-bold transition-all shadow-md justify-center items-center gap-2 hidden active:scale-[0.98]" title="Download Audio File (.wav)">
                        <i class="fa-solid fa-download"></i> Save
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        const apiKey = "";
        let currentAudio = null;
        let currentAudioBlob = null; 

        // DOM Elements
        const narrationText = document.getElementById('narration-text');
        const btnAiGenerate = document.getElementById('btn-ai-generate');
        const btnPlayTts = document.getElementById('btn-play-tts');
        const btnStopTts = document.getElementById('btn-stop-tts');
        const btnDownloadAudio = document.getElementById('btn-download-audio');
        const voiceSelect = document.getElementById('voice-select');
        const playBtnText = document.getElementById('play-btn-text');

        // Setup the Application
        function init() {
            btnAiGenerate.addEventListener('click', generateStory);
            btnPlayTts.addEventListener('click', playTTS);
            btnStopTts.addEventListener('click', stopAudio);
            btnDownloadAudio.addEventListener('click', downloadAudioFile);
            
            // Clear existing audio cache if text is edited
            narrationText.addEventListener('input', () => {
                currentAudioBlob = null;
                btnDownloadAudio.classList.add('hidden');
                btnDownloadAudio.classList.remove('flex');
                updateUIState();
            });

            updateUIState();
        }

        // Toggle button disable states
        function updateUIState() {
            btnPlayTts.disabled = narrationText.value.trim().length === 0;
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-gray-800 border-gray-700';
            let icon = '<i class="fa-solid fa-circle-info text-blue-400"></i>';
            
            if (type === 'success') { 
                bgClass = 'bg-emerald-900 border-emerald-700'; 
                icon = '<i class="fa-solid fa-circle-check text-emerald-400"></i>'; 
            } else if (type === 'error') { 
                bgClass = 'bg-red-900 border-red-700'; 
                icon = '<i class="fa-solid fa-circle-exclamation text-red-400"></i>'; 
            }

            toast.className = `toast-enter flex items-center gap-3 px-4 py-3 rounded-lg shadow-lg border text-sm font-medium text-gray-100 ${bgClass}`;
            toast.innerHTML = `${icon} <span>${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        async function generateStory() {
            btnAiGenerate.disabled = true;
            document.getElementById('ai-gen-btn-text').innerText = "Writing...";
            
            try {
                // Using gemini-3-flash-preview as the primary text model
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: "Write a short, engaging story (1-2 paragraphs) about a thrilling discovery or adventure. Make it highly descriptive." }] }] 
                    })
                });
                
                const result = await response.json();
                const text = result.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (text) {
                    // Animate the text appending
                    narrationText.value = text;
                    updateUIState();
                    showToast("Story generated successfully!", "success");
                    
                    // Reset audio state since we have new text
                    currentAudioBlob = null;
                    btnDownloadAudio.classList.add('hidden');
                    btnDownloadAudio.classList.remove('flex');
                } else {
                    throw new Error("No text returned from API.");
                }
            } catch (error) { 
                console.error("Story Gen Error:", error);
                showToast("Error generating story. Check console.", "error"); 
            } finally { 
                btnAiGenerate.disabled = false; 
                document.getElementById('ai-gen-btn-text').innerText = "Generate Story"; 
            }
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const bytes = new Uint8Array(binaryString.length);
            for (let i = 0; i < binaryString.length; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function pcmToWav(pcm16, sampleRate) {
            const buffer = new ArrayBuffer(44 + pcm16.byteLength);
            const view = new DataView(buffer);
            
            // Helper to write strings to the view
            const writeString = (offset, string) => { 
                for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); 
            };
            
            // RIFF chunk descriptor
            writeString(0, 'RIFF'); 
            view.setUint32(4, 36 + pcm16.byteLength, true); 
            writeString(8, 'WAVE');
            
            // FMT sub-chunk
            writeString(12, 'fmt '); 
            view.setUint32(16, 16, true); // Subchunk1Size (16 for PCM)
            view.setUint16(20, 1, true);  // AudioFormat (1 for PCM)
            view.setUint16(22, 1, true);  // NumChannels
            view.setUint32(24, sampleRate, true); // SampleRate
            view.setUint32(28, sampleRate * 2, true); // ByteRate (SampleRate * NumChannels * BitsPerSample/8)
            view.setUint16(32, 2, true);  // BlockAlign (NumChannels * BitsPerSample/8)
            view.setUint16(34, 16, true); // BitsPerSample
            
            // Data sub-chunk
            writeString(36, 'data'); 
            view.setUint32(40, pcm16.byteLength, true);
            
            // Write PCM data
            new Uint8Array(buffer, 44).set(new Uint8Array(pcm16.buffer));
            
            return new Blob([buffer], { type: 'audio/wav' });
        }

        async function playTTS() {
            const text = narrationText.value.trim();
            if (!text) return;
            
            btnPlayTts.disabled = true;
            playBtnText.innerText = "Generating Audio...";
            
            try {
                // We use the specific Gemini TTS model for voice synthesis
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: text }] }],
                        generationConfig: { 
                            responseModalities: ["AUDIO"], 
                            speechConfig: { 
                                voiceConfig: { 
                                    prebuiltVoiceConfig: { voiceName: voiceSelect.value } 
                                } 
                            } 
                        },
                        model: "gemini-2.5-flash-preview-tts"
                    })
                });
                
                const result = await response.json();
                const part = result.candidates?.[0]?.content?.parts?.[0];
                const audioData = part?.inlineData?.data;
                const mimeType = part?.inlineData?.mimeType;
                
                if (audioData) {
                    // Extract sample rate from MimeType or default to 24000
                    let sampleRate = 24000;
                    if (mimeType && mimeType.includes('rate=')) {
                        const match = mimeType.match(/rate=(\d+)/);
                        if (match) sampleRate = parseInt(match[1], 10);
                    }
                    
                    const pcmData = base64ToArrayBuffer(audioData);
                    const pcm16 = new Int16Array(pcmData);
                    const wavBlob = pcmToWav(pcm16, sampleRate);
                    
                    // Store blob for downloading
                    currentAudioBlob = wavBlob;
                    
                    // Show download button
                    btnDownloadAudio.classList.remove('hidden');
                    btnDownloadAudio.classList.add('flex');
                    
                    // Setup audio playback
                    currentAudio = new Audio(URL.createObjectURL(wavBlob));
                    currentAudio.onended = resetAudioUI;
                    
                    // Start playback
                    currentAudio.play();
                    
                    // Update UI for stopping
                    btnPlayTts.classList.add('hidden');
                    btnStopTts.classList.remove('hidden');
                    btnStopTts.classList.add('flex');
                } else {
                    throw new Error("Invalid audio data returned.");
                }
            } catch (e) { 
                console.error("TTS Error:", e);
                showToast("Failed to generate audio. Please try again.", "error"); 
            } finally { 
                btnPlayTts.disabled = false; 
                playBtnText.innerText = "Generate & Play Audio"; 
            }
        }

        function stopAudio() { 
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }
            resetAudioUI(); 
        }
        
        function resetAudioUI() { 
            btnStopTts.classList.add('hidden'); 
            btnStopTts.classList.remove('flex');
            btnPlayTts.classList.remove('hidden'); 
        }
        
        function downloadAudioFile() { 
            if (currentAudioBlob) {
                const voiceName = voiceSelect.value;
                saveAs(currentAudioBlob, `narration_${voiceName.toLowerCase()}.wav`); 
                showToast("Audio downloaded successfully!", "success");
            }
        }

        // Boot the app
        init();
    </script>
</body>
</html>
